{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Pet</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #f8fafc, #e2e8f0);
            min-height: 100vh;
        }

        .navbar-custom {
            background-color: white;
            border-bottom: 1px solid #ddd;
        }

        .card-custom {
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom px-4">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold">Carteira PET</span>

            <div class="ms-auto">
                <a href="{% url 'meus_pets' %}" class="btn btn-primary me-2">Voltar</a>
                <a href="{% url 'logout' %}" class="btn btn-primary">Sair</a>
            </div>
        </div>
    </nav>

    <!-- Conteúdo -->
    <div class="container py-5">

        <div class="card-custom">

            <h3 class="mb-4">Cadastro de Pet</h3>

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <!-- ESQUERDA -->
                    <div class="col-md-6">

                        <div class="mb-3">
                            <label>Nome do Pet:</label>
                            <input type="text" name="pet" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Raça:</label>
                            <input type="text" name="raca" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Sexo:</label>
                            <select name="sexo" class="form-control" required>
                                <option value="">Selecione</option>
                                <option value="M">Macho</option>
                                <option value="F">Fêmea</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>Espécie:</label>
                            <select name="especie" class="form-control" required>
                                <option value="">Selecione</option>
                                {% for e in especies %}
                                <option value="{{ e.id_especie }}">{{ e.especie }}</option>
                                {% endfor %}
                            </select>
                        </div>

                    </div>

                    <!-- DIREITA -->
                    <div class="col-md-6">

                        <div class="mb-3">
                            <label>Data de Nascimento:</label>
                            <input type="date" name="data_nascimento" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Castrado:</label>
                            <select name="castrado" class="form-control">
                                <option value="">Selecione</option>
                                <option value="S">Sim</option>
                                <option value="N">Não</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>Data de Castração:</label>
                            <input type="date" name="data_castracao" class="form-control">
                        </div>

                    </div>

                </div>

                <!-- BOTÕES -->
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary w-100">
                        Cadastrar Pet
                    </button>

                    <a href="{% url 'meus_pets' %}" class="btn btn-danger w-100">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>

    </div>

</body>

</html>
