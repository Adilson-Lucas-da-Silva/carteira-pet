{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Meus Pets</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #f8fafc, #e2e8f0);
            min-height: 100vh;
        }

        .navbar-custom {
            background-color: white;
            border-bottom: 1px solid #ddd;
        }

        .card-custom {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            height: 100%;
        }

        .pet-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-custom px-4">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold">Carteira PET</span>

            <div class="ms-auto">
                <a href="{% url 'tela_inicial_apos_login' %}" class="btn btn-primary me-2">Voltar</a>
                <a href="{% url 'logout' %}" class="btn btn-primary">Sair</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">

        <h3 class="mb-4">Meus Pets</h3>

        <div class="row g-4">

            {% for pet in pets %}

            <div class="col-md-3">
                <a href="{% url 'detalhes_pet' pet.id_pet %}" style="text-decoration: none; color: inherit;">
                    <div class="card-custom">

                        <img src="{% static 'imagens/pet_full.webp' %}" class="pet-img mb-3">

                        <h5>{{ pet.pet }}</h5>
                        <p class="text-muted">{{ pet.especie }}</p>

                    </div>
                </a>
            </div>

            {% endfor %}

            <!-- NOVO PET -->
            <div class="col-md-3">
                <a href="{% url 'cadastro_pet' %}" style="text-decoration: none;">
                    <div class="card-custom d-flex align-items-center justify-content-center" style="height: 220px;">
                        <div>
                            <h1 class="text-primary">+</h1>
                            <p>Cadastrar Novo</p>
                        </div>
                    </div>
                </a>
            </div>

        </div>

    </div>

</body>

</html>
