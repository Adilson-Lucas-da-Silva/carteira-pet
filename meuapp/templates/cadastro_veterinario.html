{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastrar Veterinário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #f8fafc, #e2e8f0);
            min-height: 100vh;
        }

        .navbar-custom {
            background-color: white;
            border-bottom: 1px solid #ddd;
        }

        .card-custom {
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-custom px-4">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold">Carteira PET</span>

            <div class="ms-auto">
                <a href="{% url 'tela_inicial_apos_login' %}" class="btn btn-primary me-2">Voltar</a>
                <a href="{% url 'logout' %}" class="btn btn-primary">Sair</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card-custom">

            <h3 class="mb-4">Cadastrar Veterinário</h3>

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <!-- ESQUERDA -->
                    <div class="col-md-6">

                        <div class="mb-3">
                            <label>Nome:</label>
                            <input type="text" name="veterinario" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Email:</label>
                            <input type="email" name="email" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Celular:</label>
                            <input type="text" name="celular" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Telefone:</label>
                            <input type="text" name="telefone" class="form-control">
                        </div>

                    </div>

                    <!-- DIREITA -->
                    <div class="col-md-6">

                        <div class="mb-3">
                            <label>Logradouro:</label>
                            <input type="text" name="logradouro" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Número:</label>
                            <input type="text" name="numero_endereco" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Bairro:</label>
                            <input type="text" name="bairro" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Cidade:</label>
                            <input type="text" name="cidade" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>UF:</label>
                            <input type="text" name="uf" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>CEP:</label>
                            <input type="text" name="cep" class="form-control">
                        </div>

                    </div>

                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary w-100">
                        Salvar
                    </button>

                    <a href="{% url 'tela_inicial_apos_login' %}" class="btn btn-danger w-100">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>
    </div>

</body>

</html>
