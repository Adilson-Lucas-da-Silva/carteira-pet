<!DOCTYPE html>
<html lang="pt-br">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Principal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #f8fafc, #e2e8f0);
            min-height: 100vh;
        }

        .navbar-custom {
            background-color: white;
            border-bottom: 1px solid #ddd;
        }

        .card-link {
            background-color: white;
            border-radius: 20px;
            padding: 25px;
            min-height: 200px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: 0.3s;
        }

        .card-link:hover {
            transform: scale(1.05);
        }

        .card-link h4 {
            margin-bottom: 15px;
            font-weight: 600;
        }

        .acoes-rapidas {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom px-4">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold">Carteira PET 🐾</span>

            <div class="ms-auto">
                <a href="{% url 'logout' %}" class="btn btn-outline-danger">
                    Sair
                </a>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <div class="container py-5">

        <!-- Título -->
        <div class="text-center mb-5">
            <h2 class="fw-bold">Bem-vindo 👋</h2>
            <p class="text-muted">Gerencie seus pets, vacinas e dados de forma simples</p>
        </div>

        <!-- AÇÕES RÁPIDAS (destaque) -->
        <div class="acoes-rapidas mb-5 text-center">
            <h5 class="mb-3">Ações rápidas</h5>

            <a href="{% url 'cadastro_pet' %}" class="btn btn-primary btn-lg">
                + Novo PET
            </a>

            <a href="{% url 'cadastro_vacina' %}" class="btn btn-success btn-lg">
                + Registrar Vacina
            </a>
            <a href="/dashboard" class="btn btn-dark btn-lg">
                📊 Dashboard
            </a>
        </div>

        <!-- Cards principais -->
        <div class="row g-4">

            <!-- Meus PETs -->
            <div class="col-md-6">
                <a href="{% url 'meus_pets' %}" class="text-decoration-none">
                    <div class="card-link">
                        <h4>Meus PETs</h4>
                        <img src="{% static 'imagens/pata_100.png' %}" class="img-fluid" style="max-height: 90px;">
                    </div>
                </a>
            </div>

            <!-- Vacinas -->
            <div class="col-md-6">
                <a href="{% url 'cadastro_vacina' %}" class="text-decoration-none">
                    <div class="card-link">
                        <h4>Vacinas</h4>
                        <img src="{% static 'imagens/seringa_100.png' %}" class="img-fluid" style="max-height: 90px;">
                    </div>
                </a>
            </div>

            <!-- Veterinários -->
            <div class="col-md-6">
                <a href="{% url 'cadastro_veterinario' %}" class="text-decoration-none">
                    <div class="card-link">
                        <h4>Veterinários</h4>
                        <img src="{% static 'imagens/jaleco_100.png' %}" class="img-fluid" style="max-height: 90px;">
                    </div>
                </a>
            </div>

            <!-- Tutor -->
            <div class="col-md-6">
                <a href="{% url 'detalhes_tutor' %}" class="text-decoration-none">
                    <div class="card-link">
                        <h4>Meus Dados</h4>
                        <img src="{% static 'imagens/homem_100.png' %}" class="img-fluid" style="max-height: 90px;">
                    </div>
                </a>
            </div>

        </div>

    </div>

</body>

</html>
